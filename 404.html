<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — Victor Vandi</title>
  <meta name="robots" content="noindex" />
</head>
<body>
<script>
(function () {
  var validPages = ['about','work','services','articles','reviews','website','contact'];
  var path = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();

  if (validPages.indexOf(path) !== -1) {
    window.location.replace('/?page=' + encodeURIComponent(path));
  } else {
    window.location.replace('/');
  }
}());
</script>
<p>Redirecting...</p>
</body>
</html>
